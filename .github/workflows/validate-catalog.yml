name: Validar catálogo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar catálogo, metadatos y SHA-256
        shell: pwsh
        run: |
          & ./tools/validate-catalog.ps1 -RepositoryRoot $PWD
          if ($LASTEXITCODE -ne 0) { throw 'La validación del catálogo falló.' }

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar las pruebas del publicador
        shell: pwsh
        run: |
          $tests = @(
            'test-theme-math.ps1'
            'test-theme-data.ps1'
            'test-theme-persistence.ps1'
            'test-theme-contrast.ps1'
            'test-no-hardcoded-colors.ps1'
            'test-button-visual.ps1'
            'test-surface-visual.ps1'
            'test-validate-catalog.ps1'
            'test-catalog-schema.ps1'
            'test-workflow-wiring.ps1'
            'test-powershell-encoding.ps1'
            'test-min-launcher-default.ps1'
            'test-gitattributes.ps1'
            'test-partial-publication-rollback.ps1'
            'test-byte-exact-restore.ps1'
            'test-publication-downgrade.ps1'
            'test-git-workflow.ps1'
            'test-new-script-publication.ps1'
            'test-script-removal.ps1'
            'test-script-size-limit.ps1'
            'test-launcher-publication.ps1'
          )
          foreach ($test in $tests) {
            Write-Host "--- $test ---"
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "tools/$test"
            if ($LASTEXITCODE -ne 0) { throw "$test falló con código $LASTEXITCODE." }
          }
